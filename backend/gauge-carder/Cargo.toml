[package]
name = "gauge-carder"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shared-types = { path = "../shared-types" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
