[package]
name = "gauge-market"
version = "0.1.0"
edition = "2024"

[dependencies]
gauge-engine = { path = "../gauge-engine" }
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = "1.0.229"
serde_json = "1.0.151"
shared-types = { path = "../shared-types" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
